version: 2
sources:
  - name: source
    schema: raw
    tables:
      - name: user_activities
        description: raw activities users performed in Quillpad
        config:
          external_location: "read_csv('seeds/user_activities.csv', header=true, types=['DATE','VARCHAR','VARCHAR'])"
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - user_id
                - event_date
                - event_name
              config:
                severity: warn
        columns:
          - name: event_date
            description: '{{ doc("event_date") }}'
          - name: user_id
            description: '{{ doc("user_id") }}'
          - name: event_name
            description: '{{ doc("event_name") }}'
