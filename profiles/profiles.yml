quillpad_active_users:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Local DuckDB database file (relative to where dbt is run, i.e. the repo root).
      # Override with DBT_DUCKDB_PATH to point at another database file.
      path: '{{ env_var("DBT_DUCKDB_PATH", "quillpad.duckdb") }}'
      schema: '{{ env_var("DBT_DUCKDB_SCHEMA", "dev") }}'
      threads: 8
    prod:
      type: duckdb
      # MotherDuck database. Auth uses the MOTHERDUCK_TOKEN env var (service account token);
      # never put the token in this file.
      path: 'md:user_activities'
      schema: '{{ env_var("DBT_DUCKDB_SCHEMA", "prod") }}'
      threads: 4
