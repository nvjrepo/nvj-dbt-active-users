quillpad_active_users:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: '{{ env_var("DBT_ENV_SNOWFLAKE_ACCOUNT") }}'
      schema: '{{ env_var("DBT_ENV_SNOWFLAKE_USERNAME")  }}'
      user: '{{ env_var("DBT_ENV_SNOWFLAKE_USERNAME") }}'
      password: '{{ env_var("DBT_ENV_SECRET_SNOWFLAKE_PASSWORD") }}'
      role: '{{ env_var("DBT_ENV_SNOWFLAKE_ROLE") }}'
      database: '{{ env_var("DBT_ENV_SNOWFLAKE_DATABASE") }}'
      warehouse: '{{ env_var("DBT_ENV_SNOWFLAKE_WAREHOUSE") }}'      
      keepalives_idle: 20
      threads: 8
      client_session_keep_alive: False
